name: Lab2 Project CI | SWT301

on:
  push:
    branches: [ "main" ]
    paths:
      - "lab2/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "lab2/**"

jobs:
  build-lab2:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: maven

    - name: Build Lab2 with Maven
      working-directory: lab2
      run: mvn -B clean package

    - name: Upload Lab2 artifact
      uses: actions/upload-artifact@v4
      with:
        name: lab2-1.0-SNAPSHOT
        path: lab2/target/*.jar
